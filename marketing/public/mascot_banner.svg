<svg width="800" height="260" viewBox="0 0 800 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="halo" cx="20%" cy="50%" r="50%">
      <stop stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="260" rx="24" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="160" cy="130" r="140" fill="url(#halo)"/>

  <!-- Left: Kuro Mascot -->
  <g transform="translate(80, 50)">
    <!-- Ears -->
    <path d="M30 55 L45 15 L68 46 Z" fill="#0d0d1a" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M37 50 L46 25 L60 44 Z" fill="#38bdf8" fill-opacity="0.3"/>
    <path d="M92 46 L115 15 L130 55 Z" fill="#0d0d1a" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M100 44 L114 25 L123 50 Z" fill="#38bdf8" fill-opacity="0.3"/>

    <!-- Head -->
    <rect x="20" y="35" width="120" height="100" rx="50" fill="#0c0c16" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6"/>
    
    <!-- Eyes -->
    <ellipse cx="56" cy="80" rx="14" ry="18" fill="#38bdf8"/>
    <circle cx="51" cy="74" r="5" fill="#ffffff"/>
    <circle cx="59" cy="84" r="2.5" fill="#ffffff" opacity="0.9"/>

    <ellipse cx="104" cy="80" rx="14" ry="18" fill="#38bdf8"/>
    <circle cx="99" cy="74" r="5" fill="#ffffff"/>
    <circle cx="107" cy="84" r="2.5" fill="#ffffff" opacity="0.9"/>

    <!-- Nose / Mouth -->
    <ellipse cx="80" cy="94" rx="3.5" ry="2.5" fill="#38bdf8"/>
    <path d="M76 98 Q80 102 84 98" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Resting Paw -->
    <rect x="30" y="118" width="26" height="20" rx="10" fill="#0d0d1a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="43" cy="128" r="4" fill="#38bdf8" fill-opacity="0.4"/>

    <!-- Right Waving Paw -->
    <g transform="rotate(18, 120, 120)">
      <rect x="110" y="112" width="28" height="24" rx="12" fill="#0d0d1a" stroke="#38bdf8" stroke-width="1.8"/>
      <circle cx="124" cy="124" r="4.5" fill="#38bdf8" fill-opacity="0.4"/>
      <circle cx="118" cy="116" r="2" fill="#38bdf8"/>
      <circle cx="124" cy="114" r="2" fill="#38bdf8"/>
      <circle cx="130" cy="116" r="2" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Right: Branding Text -->
  <g transform="translate(280, 75)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="75" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" text-anchor="middle">LINUX &amp; HYPRLAND</text>

    <text x="0" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">KURO ISLAND</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="500">The Dynamic Notch &amp; Companion for Linux Desktops</text>

    <!-- Mini Feature Badges -->
    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="110" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="55" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Realtime Lyrics</text>

      <rect x="118" y="0" width="110" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="173" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Smart Auto-Hide</text>

      <rect x="236" y="0" width="110" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="291" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Zero Idle CPU</text>
    </g>
  </g>
</svg>
